<!DOCTYPE html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok ချိတ်ဆက်ခြင်း</title>
<style>body{margin:0;font-family:system-ui,"Noto Sans Myanmar","Padauk",sans-serif;line-height:1.7;background:#fff;color:#000}main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:1.4rem}textarea{width:100%;height:110px;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;word-break:break-all}
button{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#e11d2e;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.ok{color:#1a9d5c;font-weight:700}.bad{color:#e11d2e;font-weight:700}small{opacity:.7}</style></head><body><main>
<h1>🎵 TikTok ချိတ်ဆက်ခြင်း</h1><div id="o"></div>
<script>
const q=location.search,m=q.match(/[?&]code=([^&]+)/),er=(q.match(/[?&]error_description=([^&]+)/)||q.match(/[?&]error=([^&]+)/)),o=document.getElementById('o');
const dec=s=>{try{return decodeURIComponent(s)}catch(e){return s}};
if(m){const code=dec(m[1]);o.innerHTML='<p class="ok">✅ ခွင့်ပြုပြီးပါပြီ။</p><p>အောက်က <b>code</b> ကို ကူးယူပြီး Colab ထဲက Website (TikTok ချိတ်တဲ့ စာမျက်နှာ) မှာ paste လုပ်ပါ။</p><textarea id="c" readonly></textarea><button id="b">📋 Code ကူးမည်</button><p><small>ဒီ code ကို ဘယ်သူ့ကိုမှ မပေးပါနဲ့။ တစ်ခါပဲ သုံးလို့ရပြီး မကြာခင် သက်တမ်းကုန်ပါတယ်။</small></p>';
const c=document.getElementById('c');c.value=code;document.getElementById('b').onclick=async()=>{try{await navigator.clipboard.writeText(code)}catch(e){c.select();try{document.execCommand('copy')}catch(_){}}document.getElementById('b').textContent='✅ ကူးပြီးပါပြီ'}}
else if(er){o.innerHTML='<p class="bad">❌ ခွင့်ပြုမှု မအောင်မြင်ပါ</p><p>'+dec(er[1]).replace(/[<>&]/g,'')+'</p>'}
else{o.innerHTML='<p>ဒီစာမျက်နှာကို TikTok က ခွင့်ပြုပြီးမှ ပြန်ပို့တဲ့အခါ code ပြဖို့ သုံးပါတယ်။ Colab Website ထဲက <b>🔗 TikTok မှာ ခွင့်ပြုမည်</b> ကနေ စပါ။</p>'}
</script></main></body></html>
